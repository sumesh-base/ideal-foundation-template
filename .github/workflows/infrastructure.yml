name: 'Terragrunt Infrastructure'

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'infrastructure/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'infrastructure/**'
  release:
    types: [published]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # 1. Discover Environments dynamically
  discover:
    name: 'Discover Environments'
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set-envs.outputs.environments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Find Environments
        id: set-envs
        run: |
          # Find all top-level directories in environments/ that do not start with '_'
          cd infrastructure/environments
          ENVS=$(find . -mindepth 1 -maxdepth 1 -type d ! -name "_*" -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          echo "environments=$ENVS" >> $GITHUB_OUTPUT

  # 2. Plan across all discovered environments
  plan:
    name: 'Plan: ${{ matrix.environment }}'
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.discover.outputs.environments) }}
    env:
      AWS_REGION: us-east-1
      WORKING_DIR: infrastructure/environments/${{ matrix.environment }}
    
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Determine Affected Modules
      id: diff
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
        else
          BASE_SHA=${{ github.event.before }}
          HEAD_SHA=${{ github.sha }}
        fi
        
        # If BASE_SHA is missing or all zeros (e.g., new branch), fallback to HEAD^1
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
          BASE_SHA=$(git rev-parse HEAD^1 2>/dev/null || echo "")
        fi

        echo "Diffing between $BASE_SHA and $HEAD_SHA"
        if [ -n "$BASE_SHA" ]; then
          CHANGED_FILES=$(git diff --name-only $BASE_SHA...$HEAD_SHA || git diff --name-only $BASE_SHA $HEAD_SHA)
        else
          CHANGED_FILES=$(git ls-files) # Fallback to all files
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Check if _envcommon changed
        if echo "$CHANGED_FILES" | grep -q "infrastructure/environments/_envcommon/"; then
          echo "Common module changed. Running on entire environment."
          echo "target_flags=" >> $GITHUB_ENV
          echo "skip=false" >> $GITHUB_ENV
        else
          # Find specific changed module directories for this environment
          ENV_CHANGES=$(echo "$CHANGED_FILES" | grep "^infrastructure/environments/${{ matrix.environment }}/" | grep -E "terragrunt\.hcl|\.tf" || true)
          if [ -z "$ENV_CHANGES" ]; then
            echo "No changes detected for ${{ matrix.environment }}. Skipping."
            echo "skip=true" >> $GITHUB_ENV
          else
            TARGET_FLAGS=""
            # Extract unique directories
            DIRS=$(echo "$ENV_CHANGES" | xargs -n1 dirname | sort -u)
            for d in $DIRS; do
              # We pass the relative directory starting from the working_dir
              # working-directory is infrastructure/environments/${{ matrix.environment }}
              # So if d is infrastructure/environments/dev/tenant-a/vpc, relative is tenant-a/vpc
              REL_DIR=${d#infrastructure/environments/${{ matrix.environment }}/}
              TARGET_FLAGS="$TARGET_FLAGS --terragrunt-include-dir $REL_DIR"
            done
            echo "Target flags: $TARGET_FLAGS"
            echo "target_flags=$TARGET_FLAGS" >> $GITHUB_ENV
            echo "skip=false" >> $GITHUB_ENV
          fi
        fi

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        # In an enterprise, map matrix.environment to a specific AWS account role using GitHub Secrets or vars.
        # e.g., role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', env.ENV_UPPER)] }}
        # For now, we fallback to the default role if env-specific doesn't exist (using the one we already have).
        role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.9.0
        terraform_wrapper: false
        
    - name: Setup Terragrunt
      run: |
        curl -sLo /tmp/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.66.0/terragrunt_linux_amd64
        chmod +x /tmp/terragrunt
        sudo mv /tmp/terragrunt /usr/local/bin/terragrunt

    - name: Terragrunt Init
      if: env.skip == 'false'
      run: terragrunt run-all init --terragrunt-non-interactive $target_flags
      working-directory: ${{ env.WORKING_DIR }}
      
    - name: Terragrunt Plan
      id: plan
      if: env.skip == 'false'
      run: |
        terragrunt run-all plan --terragrunt-non-interactive $target_flags -no-color 2>&1 | tee /tmp/plan_output.txt
        
        cat << 'PYEOF' > /tmp/parse_plan.py
        import re
        with open('/tmp/plan_output.txt', 'r') as f:
            log = f.read()
        modules = {}
        current_module = "unknown"
        for line in log.splitlines():
            m_prefix = re.search(r'prefix=\[.*?/environments/[^/]+/(.+?)\]', line)
            if m_prefix:
                current_module = m_prefix.group(1)
                if current_module not in modules:
                    modules[current_module] = {'add': [], 'change': [], 'destroy': [], 'replace': [], 'counts': {'add': 0, 'change': 0, 'destroy': 0}}
                    
            m_res = re.search(r'^\s+# (.*) (will be created|will be updated in-place|will be destroyed|must be replaced)', line)
            if m_res and current_module != "unknown":
                res_name = m_res.group(1)
                action = m_res.group(2)
                if action == "will be created":
                    modules[current_module]['add'].append(res_name)
                elif action == "will be updated in-place":
                    modules[current_module]['change'].append(res_name)
                elif action == "will be destroyed":
                    modules[current_module]['destroy'].append(res_name)
                elif action == "must be replaced":
                    modules[current_module]['replace'].append(res_name)
                    
            m_plan = re.search(r'Plan: (\d+) to add, (\d+) to change, (\d+) to destroy', line)
            if m_plan and current_module != "unknown":
                add, change, destroy = m_plan.groups()
                modules[current_module]['counts']['add'] = int(add)
                modules[current_module]['counts']['change'] = int(change)
                modules[current_module]['counts']['destroy'] = int(destroy)
        
        print("### ${{ matrix.environment }} - Detailed Plan Summary")
        if not modules:
            print("No infrastructure changes detected.")
        for mod, data in modules.items():
            print(f"#### 📦 Module: `{mod}`")
            print(f"**Summary:** {data['counts']['add']} to add, {data['counts']['change']} to change, {data['counts']['destroy']} to destroy.\n")
            if data['add'] or data['change'] or data['destroy'] or data['replace']:
                print("| Action | Resource |")
                print("|--------|----------|")
                for res in data['add']:
                    print(f"| 🟢 Add | `{res}` |")
                for res in data['change']:
                    print(f"| 🟡 Change | `{res}` |")
                for res in data['replace']:
                    print(f"| 🟠 Replace | `{res}` |")
                for res in data['destroy']:
                    print(f"| 🔴 Destroy | `{res}` |")
            print("\n---")
        PYEOF
        python3 /tmp/parse_plan.py > /tmp/plan_table.md
      working-directory: ${{ env.WORKING_DIR }}

    - name: Comment PR
      if: github.event_name == 'pull_request' && env.skip == 'false'
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const table = fs.readFileSync('/tmp/plan_table.md', 'utf8');
          let plan = fs.readFileSync('/tmp/plan_output.txt', 'utf8');
          if (plan.length > 60000) {
            plan = plan.substring(0, 60000) + "\n... (truncated)";
          }
          const output = `#### Terragrunt Plan: \`${{ matrix.environment }}\` 📖\n\n${table}\n\n<details><summary>Show Full Plan Output</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

  # 3. Apply changes
  apply:
    name: 'Apply: ${{ matrix.environment }}'
    needs: [discover, plan]
    runs-on: ubuntu-latest
    # Enterprise standard: Only deploy automatically on tags/releases, OR on push to main with environments.
    # Run apply on pushes to main, releases, or manual dispatches.
    # We will dynamically skip production inside the steps if it's not a release.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.discover.outputs.environments) }}
    # Binds to the GitHub Environment protection rules (e.g. requires approval for prod)
    environment: ${{ matrix.environment }}
    env:
      AWS_REGION: us-east-1
      WORKING_DIR: infrastructure/environments/${{ matrix.environment }}
    
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Determine Affected Modules
      id: diff
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
        else
          BASE_SHA=${{ github.event.before }}
          HEAD_SHA=${{ github.sha }}
        fi
        
        # If BASE_SHA is missing or all zeros (e.g., new branch), fallback to HEAD^1
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
          BASE_SHA=$(git rev-parse HEAD^1 2>/dev/null || echo "")
        fi

        echo "Diffing between $BASE_SHA and $HEAD_SHA"
        if [ -n "$BASE_SHA" ]; then
          CHANGED_FILES=$(git diff --name-only $BASE_SHA...$HEAD_SHA || git diff --name-only $BASE_SHA $HEAD_SHA)
        else
          CHANGED_FILES=$(git ls-files) # Fallback to all files
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Check if _envcommon changed
        if echo "$CHANGED_FILES" | grep -q "infrastructure/environments/_envcommon/"; then
          echo "Common module changed. Running on entire environment."
          echo "target_flags=" >> $GITHUB_ENV
          echo "skip=false" >> $GITHUB_ENV
        else
          # Find specific changed module directories for this environment
          ENV_CHANGES=$(echo "$CHANGED_FILES" | grep "^infrastructure/environments/${{ matrix.environment }}/" | grep -E "terragrunt\.hcl|\.tf" || true)
          if [ -z "$ENV_CHANGES" ]; then
            echo "No changes detected for ${{ matrix.environment }}. Skipping."
            echo "skip=true" >> $GITHUB_ENV
          else
            TARGET_FLAGS=""
            # Extract unique directories
            DIRS=$(echo "$ENV_CHANGES" | xargs -n1 dirname | sort -u)
            for d in $DIRS; do
              # We pass the relative directory starting from the working_dir
              # working-directory is infrastructure/environments/${{ matrix.environment }}
              # So if d is infrastructure/environments/dev/tenant-a/vpc, relative is tenant-a/vpc
              REL_DIR=${d#infrastructure/environments/${{ matrix.environment }}/}
              TARGET_FLAGS="$TARGET_FLAGS --terragrunt-include-dir $REL_DIR"
            done
            echo "Target flags: $TARGET_FLAGS"
            echo "target_flags=$TARGET_FLAGS" >> $GITHUB_ENV
            echo "skip=false" >> $GITHUB_ENV
          fi
        fi

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.9.0
        terraform_wrapper: false
        
    - name: Setup Terragrunt
      run: |
        curl -sLo /tmp/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.66.0/terragrunt_linux_amd64
        chmod +x /tmp/terragrunt
        sudo mv /tmp/terragrunt /usr/local/bin/terragrunt

    - name: Terragrunt Init
      if: env.skip == 'false'
      run: terragrunt run-all init --terragrunt-non-interactive $target_flags
      working-directory: ${{ env.WORKING_DIR }}

    - name: Check Release Gates
      id: gate
      run: |
        if [[ "${{ matrix.environment }}" == "production" && "${{ github.event_name }}" == "push" ]]; then
          echo "Production deployments are locked to GitHub Releases. Skipping automated apply on standard merge."
          echo "skip=true" >> $GITHUB_ENV
        else
          echo "skip=false" >> $GITHUB_ENV
        fi
        
    - name: Terragrunt Apply
      if: env.skip == 'false'
      run: terragrunt run-all apply --terragrunt-non-interactive $target_flags
      working-directory: ${{ env.WORKING_DIR }}
