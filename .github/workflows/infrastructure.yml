name: 'Terragrunt Infrastructure'

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'infrastructure/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'infrastructure/**'

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  plan:
    name: 'Terragrunt Plan'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      WORKING_DIR: infrastructure/environments

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::496411573458:role/sumesh-github-actions-aws-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.9.0
        terraform_wrapper: false
    - name: Setup Terragrunt
      run: |
        curl -sLo /tmp/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.66.0/terragrunt_linux_amd64
        chmod +x /tmp/terragrunt
        sudo mv /tmp/terragrunt /usr/local/bin/terragrunt

    - name: Terragrunt Init
      run: terragrunt run-all init --terragrunt-non-interactive
      working-directory: ${{ env.WORKING_DIR }}

    - name: Terragrunt Plan
      run: terragrunt run-all plan --terragrunt-non-interactive
      working-directory: ${{ env.WORKING_DIR }}

  apply:
    name: 'Terragrunt Apply'
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AWS_REGION: us-east-1
      WORKING_DIR: infrastructure/environments
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::496411573458:role/sumesh-github-actions-aws-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.9.0
        terraform_wrapper: false
    - name: Setup Terragrunt
      run: |
        curl -sLo /tmp/terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.66.0/terragrunt_linux_amd64
        chmod +x /tmp/terragrunt
        sudo mv /tmp/terragrunt /usr/local/bin/terragrunt

    - name: Terragrunt Init
      run: terragrunt run-all init --terragrunt-non-interactive
      working-directory: ${{ env.WORKING_DIR }}

    - name: Terragrunt Apply
      run: terragrunt run-all apply --terragrunt-non-interactive
      working-directory: ${{ env.WORKING_DIR }}
